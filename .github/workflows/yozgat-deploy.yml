name: Deploy to Yozgat

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          YOZGAT_URL: ${{ secrets.YOZGAT_URL }}
          WEBHOOK_SECRET: ${{ secrets.YOZGAT_WEBHOOK_SECRET }}
          PROJECT_ID: ${{ vars.YOZGAT_PROJECT_ID }}
          ENV_SLUG: ${{ vars.YOZGAT_ENV_SLUG }}
        run: |
          ENV_SLUG="${ENV_SLUG:-prod}"
          PAYLOAD='{"commitHash":"${{ github.sha }}"}'
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')
          curl -sS -f -X POST "${YOZGAT_URL}/projects/${PROJECT_ID}/environments/${ENV_SLUG}/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD"